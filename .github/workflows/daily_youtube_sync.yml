name: Daily YouTube Channel Video Sync

on:
  schedule:
    # Runs automatically once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run YouTube Video Sync Script
        run: python3 scripts/sync_youtube.py

      - name: Commit and push if new videos were added
        run: |
          git config user.name "Evergreen Aging Bot"
          git config user.email "bot@evergreenaging.ca"
          git add data/videos.json js/main.js
          if git diff --staged --quiet; then
            echo "No new videos found on channel. Vault is up to date."
          else
            git commit -m "Auto-sync: add latest videos from @evergreen_aging [skip ci]"
            git push
            echo "Successfully updated video vault with newly published channel videos."
          fi
