<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printable Health Checklist | Evergreen Aging</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <style>
        * { box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
          font-size: 13.5pt;
          line-height: 1.5;
          color: #1a251f;
          padding: 2.25rem 2rem;
          max-width: 860px;
          margin: 0 auto;
          background: #ffffff;
        }
        .header-actions {
          display: flex;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 1.75rem;
        }
        .header-nav-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 12px;
          padding-bottom: 10px;
          border-bottom: 1px solid #e1e8e3;
        }
        .header-tools-row {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
          gap: 10px;
        }
        .return-btn {
          font-size: 11pt;
          font-weight: 700;
          padding: 8px 16px;
          background: #ffffff;
          color: #1b4332;
          border: 1.5px solid #1b4332;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.15s ease-in-out;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .return-btn:hover {
          background: #eef7f2;
          border-color: #166534;
        }
        .print-btn {
          font-size: 12pt;
          font-weight: 700;
          padding: 9px 20px;
          background: #1b4332;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.15s;
        }
        .print-btn:hover { background: #2d6a4f; }
        .reset-btn {
          font-size: 11pt;
          font-weight: 600;
          padding: 8px 16px;
          background: transparent;
          color: #555;
          border: 1px solid #ccc;
          border-radius: 6px;
          cursor: pointer;
        }
        .reset-btn:hover { background: #f0f0f0; }
        .share-btn {
          font-size: 11pt;
          font-weight: 600;
          padding: 8px 16px;
          background: #f0f7f2;
          color: #1b4332;
          border: 1px solid #b7dfca;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.15s;
        }
        .share-btn:hover { background: #d8f3dc; }
        .progress-pill {
          font-size: 10.5pt;
          font-weight: 700;
          color: #1b4332;
          background: #eef7f2;
          border: 1px solid #b7dfca;
          padding: 6px 14px;
          border-radius: 9999px;
          white-space: nowrap;
        }
        .doc-header {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-bottom: 12px;
          border-bottom: 2.5px solid #1b4332;
          padding-bottom: 12px;
        }
        .doc-logo {
          width: 52px;
          height: 52px;
          object-fit: cover;
          border-radius: 8px;
          border: 1.5px solid #c8d9ce;
          flex-shrink: 0;
        }
        .doc-title-area {
          flex: 1;
        }
        .doc-meta-row {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
          margin-bottom: 4px;
        }
        .doc-badge-pill {
          display: inline-block;
          background: #e8f4ed;
          color: #1b4332;
          font-size: 8pt;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          padding: 3px 8px;
          border-radius: 4px;
        }
        .doc-title-area h1 {
          margin: 0;
          font-size: 18pt;
          color: #1b4332;
          line-height: 1.25;
          font-weight: 800;
        }
        .doc-desc {
          font-size: 11pt;
          line-height: 1.5;
          margin-bottom: 1rem;
          color: #24352b;
          background: #f8faf8;
          border-left: 3.5px solid #1b4332;
          padding: 0.65rem 0.95rem;
          border-radius: 0 6px 6px 0;
        }
        .interactive-tip {
          font-size: 9.5pt;
          color: #485c4f;
          margin-bottom: 1rem;
          background: #f4f8f5;
          padding: 6px 12px;
          border-radius: 6px;
          border: 1px solid #dbe8df;
        }
        ul.checklist-list {
          list-style: none;
          padding-left: 0;
          margin: 0 0 1.5rem 0;
        }
        .checklist-item {
          padding: 0.65rem 0.6rem;
          border-bottom: 1px solid #e1e8e3;
          display: flex;
          gap: 0.75rem;
          align-items: flex-start;
          cursor: pointer;
          border-radius: 6px;
          transition: background 0.12s ease-in-out;
          user-select: none;
        }
        .checklist-item:hover {
          background: #f4f8f5;
        }
        .checklist-item.checked {
          background: #f9fcf9;
        }
        .checklist-item.checked .item-text {
          color: #4b6354;
        }
        .box {
          width: 24px;
          height: 24px;
          min-width: 24px;
          border: 2px solid #1b4332;
          flex-shrink: 0;
          margin-top: 2px;
          border-radius: 5px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          transition: all 0.15s ease-in-out;
          color: white;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .checklist-item.checked .box {
          background: #1b4332;
          border-color: #1b4332;
        }
        .box svg {
          display: none;
          width: 15px;
          height: 15px;
          stroke: #ffffff;
          stroke-width: 3.5;
          fill: none;
        }
        .checklist-item.checked .box svg {
          display: block;
        }
        .item-text {
          font-size: 12pt;
          line-height: 1.5;
          color: #1a251f;
          flex: 1;
        }
        .item-lead {
          font-size: 12.4pt;
          font-weight: 800;
          color: #143525;
        }
        .footer {
          margin-top: 2rem;
          font-size: 9pt;
          color: #485c4f;
          border-top: 1.5px solid #d5ded7;
          padding-top: 0.85rem;
          line-height: 1.4;
        }
        .source-box {
          background: #f4f8f5;
          border: 1px solid #d0dfd4;
          padding: 0.65rem 0.95rem;
          border-radius: 6px;
          margin-top: 0.5rem;
          font-size: 8.5pt;
          color: #2d4536;
          line-height: 1.4;
        }

        /* 1-Page Letter Print Optimization */
        @page {
          size: letter portrait;
          margin: 0.35in 0.4in;
        }
        @media print {
          *, *::before, *::after {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          .header-actions,
          .interactive-tip {
            display: none !important;
            visibility: hidden !important;
          }
          body {
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            font-size: 10.5pt !important;
            line-height: 1.36 !important;
            color: #1a251f !important;
          }
          .doc-header {
            margin-bottom: 0.45rem !important;
            padding-bottom: 0.45rem !important;
            border-bottom: 2px solid #1b4332 !important;
          }
          .doc-logo {
            width: 48px !important;
            height: 48px !important;
          }
          .doc-title-area h1 {
            font-size: 16pt !important;
            line-height: 1.2 !important;
            margin-bottom: 2px !important;
          }
          .doc-badge-pill {
            font-size: 7.5pt !important;
            padding: 2.5px 8px !important;
          }
          .doc-desc {
            font-size: 10.8pt !important;
            line-height: 1.4 !important;
            margin-bottom: 0.6rem !important;
            padding: 0.55rem 0.85rem !important;
            border-left: 3.5px solid #1b4332 !important;
            background: #f8faf8 !important;
          }
          ul.checklist-list {
            margin-bottom: 0.55rem !important;
          }
          .checklist-item {
            padding: 0.65rem 0.5rem !important;
            border-bottom: 1px solid #e0e7e2 !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            gap: 0.8rem !important;
          }
          .box {
            width: 24px !important;
            height: 24px !important;
            min-width: 24px !important;
            margin-top: 1px !important;
            border-width: 1.5px !important;
            border-radius: 5px !important;
          }
          .box svg {
            width: 15px !important;
            height: 15px !important;
            stroke-width: 3.5 !important;
          }
          .item-text {
            font-size: 12pt !important;
            line-height: 1.38 !important;
            color: #1a251f !important;
          }
          .item-lead {
            font-size: 12.4pt !important;
            font-weight: 800 !important;
            color: #143525 !important;
          }
          .footer {
            margin-top: 0.55rem !important;
            padding-top: 0.45rem !important;
            font-size: 8.5pt !important;
            line-height: 1.35 !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
          }
          .source-box {
            margin-top: 0.3rem !important;
            padding: 0.45rem 0.75rem !important;
            font-size: 8pt !important;
            line-height: 1.32 !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
          }

          /* Density fine-tuning for longer 10–12 item checklists (e.g. 12-Point Fall-Proofing Audit) */
          body.density-compact .doc-title-area h1 {
            font-size: 16pt !important;
          }
          body.density-compact .doc-desc {
            font-size: 10pt !important;
            line-height: 1.36 !important;
            padding: 0.45rem 0.75rem !important;
            margin-bottom: 0.45rem !important;
          }
          body.density-compact .checklist-item {
            padding: 0.48rem 0.45rem !important;
            gap: 0.75rem !important;
          }
          body.density-compact .box {
            width: 22px !important;
            height: 22px !important;
            min-width: 22px !important;
            border-radius: 4px !important;
          }
          body.density-compact .box svg {
            width: 14px !important;
            height: 14px !important;
            stroke-width: 3.5 !important;
          }
          body.density-compact .item-text {
            font-size: 11.2pt !important;
            line-height: 1.35 !important;
          }
          body.density-compact .item-lead {
            font-size: 11.5pt !important;
          }
          body.density-compact .footer {
            margin-top: 0.45rem !important;
            padding-top: 0.35rem !important;
            font-size: 8.2pt !important;
          }
          body.density-compact .source-box {
            margin-top: 0.25rem !important;
            padding: 0.35rem 0.65rem !important;
            font-size: 7.6pt !important;
          }
        }
      
  </style>
</head>
<body>
  <div id="toolkitApp"></div>

  <script src="js/main.js?v=20261024_single_tab_v1"></script>
  <script>
    function renderToolkitViewer() {
      const params = new URLSearchParams(window.location.search);
      const toolkitKey = params.get('id');

      if (toolkitKey === 'caregiver_guide') {
        window.location.replace('caregiver-poster.html');
        return;
      }

      const toolkit = (typeof healthToolkits !== 'undefined' && healthToolkits[toolkitKey]) ? healthToolkits[toolkitKey] : null;
      if (!toolkit) {
        window.location.replace('toolkits.html');
        return;
      }

      document.title = `${toolkit.title} - Evergreen Aging`;

      const isCompactList = toolkit.items.length >= 10;
      const densityClass = isCompactList ? 'density-compact' : 'density-comfortable';
      document.body.className = densityClass;

      const formattedItemsHtml = toolkit.items.map((item, idx) => {
        let content = item;
        const colonIdx = item.indexOf(':');
        if (colonIdx !== -1 && colonIdx < 55) {
          const lead = item.substring(0, colonIdx + 1);
          const rest = item.substring(colonIdx + 1);
          content = `<strong class="item-lead">${lead}</strong>${rest}`;
        }
        return `
          <li class="checklist-item" id="item-${idx}" onclick="toggleCheck(${idx})" role="checkbox" aria-checked="false" tabindex="0" onkeydown="handleKey(event, ${idx})">
            <div class="box">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="item-text">${content}</div>
          </li>
        `;
      }).join('');

      const referrer = document.referrer || '';
      let returnLabel = '← Back to Toolkits';
      if (referrer.includes('caregivers.html')) {
        returnLabel = '← Back to Caregiver Guide';
      } else if (referrer.includes('index.html')) {
        returnLabel = '← Back to Home';
      }

      const app = document.getElementById('toolkitApp');
      app.innerHTML = `
        <div class="header-actions">
          <div class="header-nav-row">
            <button class="return-btn" id="returnBtn" onclick="returnToPage()" title="Return to Evergreen Aging without opening new tabs">${returnLabel}</button>
            <div class="progress-pill" id="progressPill">0 of ${toolkit.items.length} completed</div>
          </div>
          <div class="header-tools-row">
            <button class="print-btn" onclick="window.print()">🖨️ Click to Print Checklist</button>
            <button class="reset-btn" onclick="resetChecklist()">↺ Clear Checks</button>
            <button class="share-btn" onclick="emailChecklist()">✉️ Email to Family</button>
          </div>
        </div>
        
        <div class="doc-header">
          <img src="images/logo.jpg" alt="Evergreen Aging" class="doc-logo">
          <div class="doc-title-area">
            <div class="doc-meta-row">
              <span class="doc-badge-pill">${toolkit.category}</span>
            </div>
            <h1>${toolkit.title}</h1>
          </div>
        </div>

        <div class="doc-desc">${toolkit.description}</div>
        <div class="interactive-tip">💡 Tip: Click any box or row on your screen to mark an item complete. Checked items will print as completed.</div>
        
        <ul class="checklist-list" id="checklistList">
          ${formattedItemsHtml}
        </ul>

        <div class="footer">
          <p><strong>Evergreen Aging:</strong> Independent Healthy Aging &amp; Senior Mobility Education &bull; https://www.youtube.com/@evergreen_aging</p>
          <div class="source-box">
            <strong>Supporting Public Health Guidelines:</strong> Formulated in consultation with guidelines published by ${toolkit.authority} (<em>${toolkit.citationTitle}</em>). Public access URL: ${toolkit.citationUrl}
          </div>
        </div>
      `;

      window.currentTotalItems = toolkit.items.length;
      window.currentToolkitTitle = toolkit.title;
    }

    function returnToPage() {
      const referrer = document.referrer || '';
      let fallback = 'toolkits.html';
      if (referrer.includes('caregivers.html')) {
        fallback = 'caregivers.html';
      } else if (referrer.includes('index.html')) {
        fallback = 'index.html';
      }
      if (window.history.length > 1 && referrer && referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = fallback;
      }
    }

    function toggleCheck(idx) {
      const item = document.getElementById('item-' + idx);
      if (!item) return;
      const isChecked = item.classList.toggle('checked');
      item.setAttribute('aria-checked', isChecked ? 'true' : 'false');
      updateProgress();
    }

    function handleKey(e, idx) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleCheck(idx);
      }
    }

    function resetChecklist() {
      const items = document.querySelectorAll('.checklist-item');
      items.forEach(item => {
        item.classList.remove('checked');
        item.setAttribute('aria-checked', 'false');
      });
      updateProgress();
    }

    function updateProgress() {
      const checked = document.querySelectorAll('.checklist-item.checked').length;
      const pill = document.getElementById('progressPill');
      const total = window.currentTotalItems || 0;
      if (pill) {
        if (checked === total && total > 0) {
          pill.textContent = '🎉 All ' + total + ' items completed!';
          pill.style.background = '#d8f3dc';
          pill.style.borderColor = '#52b788';
        } else {
          pill.textContent = checked + ' of ' + total + ' completed';
          pill.style.background = '#eef7f2';
          pill.style.borderColor = '#b7dfca';
        }
      }
    }

    function emailChecklist() {
      const title = window.currentToolkitTitle || 'Health Checklist';
      const subject = encodeURIComponent(title + ' - Evergreen Aging');
      const body = encodeURIComponent('Hi,\n\nHere is the free printable health checklist from Evergreen Aging: \"' + title + '\"\n\n' + window.location.href);
      window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderToolkitViewer);
    } else {
      renderToolkitViewer();
    }
  </script>
</body>
</html>
